<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <div id="head">hello</div> -->
</body>
</html>
<script>
    //1. step-1 create element

    const el = document.createElement("div");
    console.log(el);

    //2. step-2 write data

    el.innerText = "hello";

    //3. append/add on body

    document.querySelector("body").append(el);

    //4. id/class
    el.setAttribute("id","head")

    //5.css
    el.style.color = "red" 
</script>
